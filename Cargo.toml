[package]
name = "ghost-sync"
version = "0.1.0"
edition = "2021"
authors = ["ronakgh97@gmail.com"]
description = "A composable network libray for Game Development."
license = "MIT"
repository = "https:/github.com/ronakgh97/ghost-sync"
homepage = "https:/github.com/ronakgh97/ghost-sync"
documentation = "https:/github.com/ronakgh97/ghost-sync/master/README.md"

[[example]]
name = "gs-daemon"
path = "examples/daemon.rs"

[[example]]
name = "gs-client"
path = "examples/daemon_client.rs"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = false

[profile.dev]
opt-level = 1
debug = true
incremental = true

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
dashmap = "7.0.0-rc2"
anyhow = "1.0.102"
wincode = { version = "0.5.0", features = ["derive", "uuid"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
bytes = "1.11.1"
colored = "3.1.1"
dotenv = "0.15.0"
chrono = "0.4.44"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["test-util"] }
macroquad = "0.4.14"
rand = "0.10.0"
clap = { version = "4.6.0", features = ["derive"] }
cliclack = "0.5.2"